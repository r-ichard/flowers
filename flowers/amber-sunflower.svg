<!--
  name: Amber Sunflower
  author: r-ichard
  model: opencode-go/qwen3.8-max
  prompt: Draw an amber sunflower seen from directly above (top-down bloom, no stem or background) on a 255x255 canvas, centered, as a clean flat vector SVG with two rings of pointed petals around a seeded brown disc.
  comment: One-shot: pasted the benchmark prompt to qwen3.8-max; it drew two rings of pointed petals around a seeded disc on the first try, no fixes needed.
  github: r-ichard
-->
<svg viewBox="0 0 255 255" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rayFront" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e0820e" />
      <stop offset="55%" stop-color="#f6ad25" />
      <stop offset="100%" stop-color="#ffd95e" />
    </linearGradient>
    <radialGradient id="discFill" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#8a5526" />
      <stop offset="60%" stop-color="#6b3d17" />
      <stop offset="100%" stop-color="#4f2a0e" />
    </radialGradient>
    <path id="ray" d="M0 0 C -13 -28 -17 -66 0 -102 C 17 -66 13 -28 0 0 Z" />
  </defs>

  <g transform="translate(127.5 127.5)">
    <!-- Back ring of rays, offset half a step -->
    <g fill="#c96f14" stroke="#a05510" stroke-width="0.8">
      <use href="#ray" transform="rotate(11.25) scale(1.06)" />
      <use href="#ray" transform="rotate(33.75) scale(1.06)" />
      <use href="#ray" transform="rotate(56.25) scale(1.06)" />
      <use href="#ray" transform="rotate(78.75) scale(1.06)" />
      <use href="#ray" transform="rotate(101.25) scale(1.06)" />
      <use href="#ray" transform="rotate(123.75) scale(1.06)" />
      <use href="#ray" transform="rotate(146.25) scale(1.06)" />
      <use href="#ray" transform="rotate(168.75) scale(1.06)" />
      <use href="#ray" transform="rotate(191.25) scale(1.06)" />
      <use href="#ray" transform="rotate(213.75) scale(1.06)" />
      <use href="#ray" transform="rotate(236.25) scale(1.06)" />
      <use href="#ray" transform="rotate(258.75) scale(1.06)" />
      <use href="#ray" transform="rotate(281.25) scale(1.06)" />
      <use href="#ray" transform="rotate(303.75) scale(1.06)" />
      <use href="#ray" transform="rotate(326.25) scale(1.06)" />
      <use href="#ray" transform="rotate(348.75) scale(1.06)" />
    </g>

    <!-- Front ring of rays -->
    <g fill="url(#rayFront)" stroke="#b8641a" stroke-width="0.8">
      <use href="#ray" transform="rotate(0)" />
      <use href="#ray" transform="rotate(22.5)" />
      <use href="#ray" transform="rotate(45)" />
      <use href="#ray" transform="rotate(67.5)" />
      <use href="#ray" transform="rotate(90)" />
      <use href="#ray" transform="rotate(112.5)" />
      <use href="#ray" transform="rotate(135)" />
      <use href="#ray" transform="rotate(157.5)" />
      <use href="#ray" transform="rotate(180)" />
      <use href="#ray" transform="rotate(202.5)" />
      <use href="#ray" transform="rotate(225)" />
      <use href="#ray" transform="rotate(247.5)" />
      <use href="#ray" transform="rotate(270)" />
      <use href="#ray" transform="rotate(292.5)" />
      <use href="#ray" transform="rotate(315)" />
      <use href="#ray" transform="rotate(337.5)" />
    </g>

    <!-- Seed disc -->
    <circle r="38" fill="url(#discFill)" stroke="#3f2109" stroke-width="1.2" />
    <g fill="#3a220d">
      <circle cx="0" cy="-28" r="2.6" />
      <circle cx="14" cy="-24.25" r="2.6" />
      <circle cx="24.25" cy="-14" r="2.6" />
      <circle cx="28" cy="0" r="2.6" />
      <circle cx="24.25" cy="14" r="2.6" />
      <circle cx="14" cy="24.25" r="2.6" />
      <circle cx="0" cy="28" r="2.6" />
      <circle cx="-14" cy="24.25" r="2.6" />
      <circle cx="-24.25" cy="14" r="2.6" />
      <circle cx="-28" cy="0" r="2.6" />
      <circle cx="-24.25" cy="-14" r="2.6" />
      <circle cx="-14" cy="-24.25" r="2.6" />
      <circle cx="7.27" cy="-17.55" r="2.4" />
      <circle cx="17.55" cy="-7.27" r="2.4" />
      <circle cx="17.55" cy="7.27" r="2.4" />
      <circle cx="7.27" cy="17.55" r="2.4" />
      <circle cx="-7.27" cy="17.55" r="2.4" />
      <circle cx="-17.55" cy="7.27" r="2.4" />
      <circle cx="-17.55" cy="-7.27" r="2.4" />
      <circle cx="-7.27" cy="-17.55" r="2.4" />
      <circle cx="0" cy="-10" r="2.2" />
      <circle cx="9.51" cy="-3.09" r="2.2" />
      <circle cx="5.88" cy="8.09" r="2.2" />
      <circle cx="-5.88" cy="8.09" r="2.2" />
      <circle cx="-9.51" cy="-3.09" r="2.2" />
      <circle cx="0" cy="0" r="2.4" />
    </g>
  </g>
</svg>
