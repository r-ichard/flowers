<!--
  name: Aurora Lily
  author: r-ichard
  model: minimax-m3
  comment: Designed a six-tepal lily top-down: a petal and a narrower sepal path defined in <defs> and reused via <use> at 60 degree intervals (sepals at 0/120/240 drawn behind petals at 60/180/300), with six stamens and a golden gradient center disc. Passed the contribution gate on the first run.
  github: r-ichard
-->
<svg viewBox="0 0 255 255" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aurora-lily-petal" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#fff0e0"/>
      <stop offset="55%" stop-color="#ffb89a"/>
      <stop offset="100%" stop-color="#e87060"/>
    </linearGradient>
    <linearGradient id="aurora-lily-sepal" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#d4e4a8"/>
      <stop offset="100%" stop-color="#7a9a4a"/>
    </linearGradient>
    <radialGradient id="aurora-lily-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5c8"/>
      <stop offset="100%" stop-color="#c89a2a"/>
    </radialGradient>
    <path id="aurora-lily-petal-shape" d="M0,-8 C28,-30 34,-90 0,-110 C-34,-90 -28,-30 0,-8Z"/>
    <path id="aurora-lily-sepal-shape" d="M0,-6 C20,-25 24,-85 0,-100 C-24,-85 -20,-25 0,-6Z"/>
    <g id="aurora-lily-stamen">
      <line x1="0" y1="-8" x2="0" y2="-30" stroke="#8a6a2a" stroke-width="1.4" stroke-linecap="round"/>
      <ellipse cx="0" cy="-34" rx="3" ry="6" fill="#5a3a1a"/>
    </g>
  </defs>
  <g transform="translate(127.5 127.5)">
    <use href="#aurora-lily-sepal-shape" fill="url(#aurora-lily-sepal)" transform="rotate(0)"/>
    <use href="#aurora-lily-sepal-shape" fill="url(#aurora-lily-sepal)" transform="rotate(120)"/>
    <use href="#aurora-lily-sepal-shape" fill="url(#aurora-lily-sepal)" transform="rotate(240)"/>
    <use href="#aurora-lily-petal-shape" fill="url(#aurora-lily-petal)" transform="rotate(60)"/>
    <use href="#aurora-lily-petal-shape" fill="url(#aurora-lily-petal)" transform="rotate(180)"/>
    <use href="#aurora-lily-petal-shape" fill="url(#aurora-lily-petal)" transform="rotate(300)"/>
    <circle r="14" fill="url(#aurora-lily-center)"/>
    <use href="#aurora-lily-stamen" transform="rotate(30)"/>
    <use href="#aurora-lily-stamen" transform="rotate(90)"/>
    <use href="#aurora-lily-stamen" transform="rotate(150)"/>
    <use href="#aurora-lily-stamen" transform="rotate(210)"/>
    <use href="#aurora-lily-stamen" transform="rotate(270)"/>
    <use href="#aurora-lily-stamen" transform="rotate(330)"/>
    <circle r="3" fill="#6a4a1a"/>
  </g>
</svg>
