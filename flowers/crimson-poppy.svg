<!--
  name: Crimson Poppy
  author: r-ichard
  model: claude-haiku-4-5-20251001
  comment: Done in 33s didn't rework - doesn't really look like a flower :(
  github: r-ichard
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 255 255">
  <defs>
    <radialGradient id="crimson-poppy-centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#3d2817;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="crimson-poppy-petalGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ff4466;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc1133;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Back petals (darker, further back) -->
  <ellipse cx="127.5" cy="60" rx="35" ry="50" fill="#bb0022" opacity="0.8" transform="rotate(0 127.5 127.5)" />
  <ellipse cx="180" cy="90" rx="35" ry="50" fill="#bb0022" opacity="0.8" transform="rotate(60 127.5 127.5)" />
  <ellipse cx="195" cy="165" rx="35" ry="50" fill="#bb0022" opacity="0.8" transform="rotate(120 127.5 127.5)" />
  <ellipse cx="127.5" cy="195" rx="35" ry="50" fill="#bb0022" opacity="0.8" transform="rotate(180 127.5 127.5)" />
  <ellipse cx="60" cy="165" rx="35" ry="50" fill="#bb0022" opacity="0.8" transform="rotate(240 127.5 127.5)" />
  <ellipse cx="45" cy="90" rx="35" ry="50" fill="#bb0022" opacity="0.8" transform="rotate(300 127.5 127.5)" />

  <!-- Middle petals (brighter, more forward) -->
  <ellipse cx="127.5" cy="50" rx="38" ry="55" fill="url(#crimson-poppy-petalGrad)" opacity="0.95" transform="rotate(-15 127.5 127.5)" />
  <ellipse cx="195" cy="75" rx="38" ry="55" fill="url(#crimson-poppy-petalGrad)" opacity="0.95" transform="rotate(45 127.5 127.5)" />
  <ellipse cx="210" cy="155" rx="38" ry="55" fill="url(#crimson-poppy-petalGrad)" opacity="0.95" transform="rotate(105 127.5 127.5)" />
  <ellipse cx="130" cy="210" rx="38" ry="55" fill="url(#crimson-poppy-petalGrad)" opacity="0.95" transform="rotate(165 127.5 127.5)" />
  <ellipse cx="45" cy="180" rx="38" ry="55" fill="url(#crimson-poppy-petalGrad)" opacity="0.95" transform="rotate(225 127.5 127.5)" />
  <ellipse cx="35" cy="95" rx="38" ry="55" fill="url(#crimson-poppy-petalGrad)" opacity="0.95" transform="rotate(285 127.5 127.5)" />

  <!-- Front petals (brightest, most forward) -->
  <ellipse cx="127.5" cy="45" rx="40" ry="58" fill="#ff5577" transform="rotate(-30 127.5 127.5)" />
  <ellipse cx="210" cy="70" rx="40" ry="58" fill="#ff5577" transform="rotate(30 127.5 127.5)" />
  <ellipse cx="220" cy="160" rx="40" ry="58" fill="#ff5577" transform="rotate(90 127.5 127.5)" />
  <ellipse cx="127.5" cy="220" rx="40" ry="58" fill="#ff5577" transform="rotate(150 127.5 127.5)" />
  <ellipse cx="35" cy="190" rx="40" ry="58" fill="#ff5577" transform="rotate(210 127.5 127.5)" />
  <ellipse cx="30" cy="90" rx="40" ry="58" fill="#ff5577" transform="rotate(270 127.5 127.5)" />

  <!-- Central disc with texture -->
  <circle cx="127.5" cy="127.5" r="32" fill="url(#crimson-poppy-centerGrad)" />

  <!-- Stamen details -->
  <circle cx="127.5" cy="110" r="2.5" fill="#2a2a2a" />
  <circle cx="145" cy="120" r="2.5" fill="#2a2a2a" />
  <circle cx="145" cy="135" r="2.5" fill="#2a2a2a" />
  <circle cx="127.5" cy="145" r="2.5" fill="#2a2a2a" />
  <circle cx="110" cy="135" r="2.5" fill="#2a2a2a" />
  <circle cx="110" cy="120" r="2.5" fill="#2a2a2a" />

  <!-- Center highlight -->
  <circle cx="127.5" cy="127.5" r="28" fill="none" stroke="#4a3525" stroke-width="0.5" opacity="0.6" />
  <circle cx="120" cy="120" r="6" fill="#3d2817" opacity="0.7" />
</svg>
