      <use href="#indigo-lotus-seed" transform="rotate(45)" />
      <use href="#indigo-lotus-seed" transform="rotate(90)" />
      <use href="#indigo-lotus-seed" transform="rotate(135)" />
      <use href="#indigo-lotus-seed" transform="rotate(180)" />
