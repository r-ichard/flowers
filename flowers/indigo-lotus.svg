<!--
  name: Indigo Lotus
  author: r-ichard
  model: opencode-go/gpt-5.6-luna
  comment: Built in one pass with two rotated petal rings and a warm seedpod center to keep the top-down silhouette crisp.
  github: r-ichard
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 255 255">
  <defs>
    <radialGradient id="indigo-lotus-outerPetalFill" cx="50%" cy="88%" r="100%">
      <stop offset="0%" stop-color="#1d2b55" />
      <stop offset="55%" stop-color="#3e6398" />
      <stop offset="100%" stop-color="#94d7d5" />
    </radialGradient>
    <radialGradient id="indigo-lotus-innerPetalFill" cx="50%" cy="88%" r="100%">
      <stop offset="0%" stop-color="#3a245f" />
      <stop offset="58%" stop-color="#7653a0" />
      <stop offset="100%" stop-color="#d4b4dc" />
    </radialGradient>
    <radialGradient id="indigo-lotus-centerFill" cx="42%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#fff0a8" />
      <stop offset="60%" stop-color="#f2bd45" />
      <stop offset="100%" stop-color="#bd6724" />
    </radialGradient>
    <path id="indigo-lotus-outerPetal" d="M0 7 C-21-4-38-31-38-58 C-38-83-20-104 0-110 C20-104 38-83 38-58 C38-31 21-4 0 7Z" />
    <path id="indigo-lotus-innerPetal" d="M0 7 C-17-3-30-23-30-45 C-30-66-14-84 0-91 C14-84 30-66 30-45 C30-23 17-3 0 7Z" />
    <path id="indigo-lotus-petalVein" d="M0 4 C-2-25-1-62 0-99" fill="none" />
    <circle id="indigo-lotus-stamen" cx="0" cy="-32" r="2.6" />
    <circle id="indigo-lotus-seed" cx="0" cy="-13" r="2.3" />
  </defs>

  <g transform="translate(127.5 127.5)">
