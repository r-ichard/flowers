      <use href="#indigo-lotus-petalVein" transform="rotate(300)" />
      <use href="#indigo-lotus-petalVein" transform="rotate(330)" />
    </g>

    <g fill="url(#indigo-lotus-innerPetalFill)" stroke="#382052" stroke-width="1" stroke-linejoin="round">
