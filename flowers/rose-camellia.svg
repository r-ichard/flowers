<!--
  name: Rose Camellia
  author: Richard
  model: opencode-go/hy3
  prompt: Draw a top-down flower (just the head, no stem/ground/background) on a 255x255 canvas, flat vector shapes only, safe inline SVG.
  comment: Generated procedurally by arranging rotated petal copies around a center using a local <use> reference.
  github: richard
-->
<svg viewBox="0 0 255 255" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="rose-camellia-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="55%" stop-color="#ffcf4d"/>
      <stop offset="100%" stop-color="#e8a92e"/>
    </radialGradient>
    <linearGradient id="rose-camellia-petal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7a8c4"/>
      <stop offset="100%" stop-color="#d6487f"/>
    </linearGradient>
    <g id="rose-camellia-petal-shape">
      <ellipse cx="127.5" cy="62" rx="22" ry="48" fill="url(#rose-camellia-petal)"/>
    </g>
    <g id="rose-camellia-petal-inner">
      <ellipse cx="127.5" cy="92" rx="15" ry="34" fill="#e06ba0"/>
    </g>
  </defs>

  <g>
    <use href="#rose-camellia-petal-shape" transform="rotate(0 127.5 127.5)"/>
    <use href="#rose-camellia-petal-shape" transform="rotate(40 127.5 127.5)"/>
    <use href="#rose-camellia-petal-shape" transform="rotate(80 127.5 127.5)"/>
    <use href="#rose-camellia-petal-shape" transform="rotate(120 127.5 127.5)"/>
    <use href="#rose-camellia-petal-shape" transform="rotate(160 127.5 127.5)"/>
    <use href="#rose-camellia-petal-shape" transform="rotate(200 127.5 127.5)"/>
    <use href="#rose-camellia-petal-shape" transform="rotate(240 127.5 127.5)"/>
    <use href="#rose-camellia-petal-shape" transform="rotate(280 127.5 127.5)"/>
    <use href="#rose-camellia-petal-shape" transform="rotate(320 127.5 127.5)"/>
  </g>

  <g opacity="0.55">
    <use href="#rose-camellia-petal-inner" transform="rotate(20 127.5 127.5)"/>
    <use href="#rose-camellia-petal-inner" transform="rotate(60 127.5 127.5)"/>
    <use href="#rose-camellia-petal-inner" transform="rotate(100 127.5 127.5)"/>
    <use href="#rose-camellia-petal-inner" transform="rotate(140 127.5 127.5)"/>
    <use href="#rose-camellia-petal-inner" transform="rotate(180 127.5 127.5)"/>
    <use href="#rose-camellia-petal-inner" transform="rotate(220 127.5 127.5)"/>
    <use href="#rose-camellia-petal-inner" transform="rotate(260 127.5 127.5)"/>
    <use href="#rose-camellia-petal-inner" transform="rotate(300 127.5 127.5)"/>
    <use href="#rose-camellia-petal-inner" transform="rotate(340 127.5 127.5)"/>
  </g>

  <circle cx="127.5" cy="127.5" r="34" fill="url(#rose-camellia-center)"/>
  <circle cx="127.5" cy="127.5" r="34" fill="none" stroke="#c98a1f" stroke-width="2"/>
</svg>
